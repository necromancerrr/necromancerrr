name: render-header

# Re-renders assets/header.svg whenever the profile config, photo, or
# generator changes on main — so the header can be edited entirely from
# the GitHub web UI, no local Python needed.

on:
  push:
    branches: [main]
    paths:
      - profile.toml
      - assets/photo.png
      - scripts/generate.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - run: python scripts/generate.py

      - name: Commit header if it changed
        run: |
          if ! git diff --quiet assets/header.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/header.svg
            git commit -m "chore: re-render header"
            git push
          fi
